name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: SpendCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Packages/SpendCore

  app:
    name: Build, test, screenshot, package
    needs: core
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: xcodebuild -version && swift --version

      - name: Generate project
        run: brew install xcodegen xcbeautify && xcodegen generate

      - name: Pick simulator
        id: sim
        run: echo "udid=$(scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Spendwise.xcodeproj -scheme Spendwise \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-test.log | xcbeautify --renderer github-actions

      - name: Screenshots
        run: scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" build/sim/Build/Products/Debug-iphonesimulator/Spendwise.app screenshots

      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild build \
            -project Spendwise.xcodeproj -scheme Spendwise -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-device.log | xcbeautify --renderer github-actions

      - name: Package IPA
        run: scripts/package-ipa.sh build/device/Build/Products/Release-iphoneos/Spendwise.app Spendwise.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: Spendwise-ipa
          path: Spendwise.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build-*.log

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Spendwise.ipa screenshots/*.png \
            --title "Spendwise (latest main)" --prerelease \
            --notes "Built from ${GITHUB_SHA::7}. Install Spendwise.ipa with SideStore."
